<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="jd-sky" x1="0" y1="0" x2="0" y2="1">
<stop class="jd-s0" offset="0" stop-color="#eef4ef"/>
<stop class="jd-s1" offset="1" stop-color="#dbe8dd"/>
</linearGradient>
<radialGradient id="jd-mist">
<stop class="jd-mc" offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
</defs>
<style>
.jd-mist1{animation:jd-drift 38s ease-in-out infinite alternate}
.jd-mist2{animation:jd-drift 52s ease-in-out infinite alternate-reverse}
.jd-sway{transform-box:fill-box;transform-origin:50% 100%;animation:jd-sway 10s ease-in-out infinite alternate}
.jd-sway2{animation-duration:13s;animation-delay:-4s}
@keyframes jd-drift{from{transform:translateX(-120px)}to{transform:translateX(160px)}}
@keyframes jd-sway{from{transform:rotate(-0.7deg)}to{transform:rotate(0.7deg)}}
@media (prefers-color-scheme: dark){
.jd-s0{stop-color:#0c1410}
.jd-s1{stop-color:#14201a}
.jd-sun{fill:#cfe0d4;opacity:0.08}
.jd-h1{fill:#17241e}
.jd-h2{fill:#1c2c24}
.jd-h3{fill:#22362c}
.jd-mc{stop-opacity:0.08}
.jd-st{fill:#2c4537}
.jd-nd{fill:#22382c}
.jd-lf{fill:#31503f}
}
</style>
