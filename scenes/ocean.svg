<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="oc-sky" x1="0" y1="0" x2="0" y2="1">
<stop class="oc-s0" offset="0" stop-color="#eef4f9"/>
<stop class="oc-s1" offset="1" stop-color="#d3e1ee"/>
</linearGradient>
<radialGradient id="oc-glow" gradientUnits="userSpaceOnUse" cx="1330" cy="200" r="280">
<stop class="oc-g0" offset="0" stop-color="#fff3d6" stop-opacity="0.9"/>
<stop class="oc-g1" offset="1" stop-color="#fff3d6" stop-opacity="0"/>
</radialGradient>
</defs>
<style>
.oc-halo{animation:oc-breathe 12s ease-in-out infinite alternate}
.oc-w1{animation:oc-right 44s linear infinite}
.oc-w2{animation:oc-left 32s linear infinite}
.oc-w3{animation:oc-left 24s linear infinite}
.oc-glint{animation:oc-shimmer 5s ease-in-out infinite alternate}
@keyframes oc-left{from{transform:translateX(0)}to{transform:translateX(-400px)}}
@keyframes oc-right{from{transform:translateX(0)}to{transform:translateX(400px)}}
@keyframes oc-breathe{from{opacity:0.75}to{opacity:1}}
@keyframes oc-shimmer{from{opacity:0.15}to{opacity:0.6}}
@keyframes oc-twinkle{from{opacity:0.25}to{opacity:0.85}}
@media (prefers-color-scheme: dark){
.oc-s0{stop-color:#07111b}
.oc-s1{stop-color:#10243a}
.oc-g0{stop-color:#9fc3ea;stop-opacity:0.28}
.oc-g1{stop-color:#9fc3ea}
.oc-moon{fill:#e6eef7}
.oc-star{opacity:0.6;animation:oc-twinkle 4.5s ease-in-out infinite alternate}
.oc-f1{fill:#0f2a45}
.oc-f2{fill:#133556}
.oc-f3{fill:#184068}
.oc-glint{fill:#cfe2f5}
}
</style>
<!-- sky -->
